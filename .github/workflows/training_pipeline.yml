name: Training Pipeline

on:
  schedule:
    - cron: "30 2 * * *"   # once a day at 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit models/ and artifacts/

concurrency:
  group: aqi-data-write   # shares the lock with the feature pipeline's git push
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train and save models
        env:
          CITY_NAME: ${{ secrets.CITY_NAME }}
        run: python src/training_pipeline.py

      - name: Commit trained models back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ artifacts/
          git diff --quiet --cached || git commit -m "Daily model retrain [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Upload training run summary as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: artifacts/
          retention-days: 14
